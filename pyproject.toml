[project]
name = "trusted-trade-agents"
version = "0.1.0"
description = "Valio Aimo Junction 2026: AI purchasing agent with guardrails and human approval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
