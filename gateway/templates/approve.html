<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Approve order · Valio Aimo</title>
<style>
:root{--valio:#002f6d;--ink:#001b40;--mute:#667085;--line:#e8eaef;--ok:#12945a;--warn:#b75c00;--bad:#d92d20}
*{box-sizing:border-box}body{margin:0;background:#eaf4fd;font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink)}
header{background:var(--valio);color:#fff;padding:18px 20px 16px}header small{display:block;opacity:.75;font-size:13px}header b{font-size:19px}
main{padding:14px}.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px #0001;overflow:hidden}
.top{padding:18px}.amount{font-size:36px;font-weight:800;letter-spacing:-.02em}.lines{margin:6px 0 0;color:#344054}
.why{margin:14px 0 0;background:#fff4e5;border-radius:12px;padding:12px 14px;color:#7a3d00}.why b{color:var(--warn)}
.perf{border-top:2px dashed var(--line);margin:0 14px}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px}
.stamp{border:1.5px solid #b8c7e6;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--valio)}.stamp b{display:block}
.stamp.warn{border-color:#f1c58c;color:var(--warn);background:#fff8ee;grid-column:1/-1}
.sig{font:12px ui-monospace,Menlo,monospace;color:var(--mute);padding:0 16px 12px}
form{padding:0 14px 18px}textarea{width:100%;border:1.5px solid #d0d5dd;border-radius:12px;padding:10px;font:inherit;min-height:70px;margin-bottom:10px}
label{font-size:14px;font-weight:600;display:block;margin:0 2px 6px}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}button{padding:15px;border-radius:14px;font:700 17px/1 inherit;border:0}
.rej{background:#fff;color:var(--bad);border:1.5px solid #f3c3be}.app{background:var(--ok);color:#fff}
.done{padding:28px 20px;text-align:center}.done h1{margin:0 0 6px;font-size:24px}.done.ok h1{color:var(--ok)}.done.bad h1{color:var(--bad)}
.foot{text-align:center;color:var(--mute);font-size:12.5px;padding:16px}
</style></head><body>
<header><small>__BUYER__ · purchasing</small><b>__TITLE__</b></header>
<main>__BODY__</main>
<div class="foot">Signed approval link for __APPROVER__ · single use · expires in 30 min</div>
</body></html>
