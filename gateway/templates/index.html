<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Buyer agent · Trusted Trade Agents</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="inner">
  <div class="brand">Trusted Trade Agents</div>
  <nav class="tabs"><a href="/" class="on">Buyer agent</a><a href="/plan">Week plan</a><a href="/valio">Valio view</a><a href="/connect">Connect an agent</a></nav>
  <div class="right"><span class="pill">Demo data</span></div>
</div></header>

<div class="page">
  <div class="phead"><div><h1>Ask the agent</h1><p>Say what the kitchen needs. The agent buys it from Valio Aimo, within the buyer's rules.</p></div></div>
  <div class="panel">
    <div class="fgrid">
      <div class="f span3"><label for="mandate">Buying for</label><select id="mandate" onchange="renderMandate()"></select></div>
      <div class="f span9"><label for="request">What the kitchen needs</label>
        <div class="composer" style="padding:6px 6px 6px 18px">
          <textarea id="request" rows="1" placeholder="e.g. 100 litres of lactose-free milk by Monday" oninput="fitRequest()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();run()}">I need 1,000 litres of lactose-free milk by Monday.</textarea>
          <label class="btn btn-soft photo-btn" title="Read a photo of a handwritten or printed list">Photo of a list
            <input type="file" accept="image/*" capture="environment" hidden onchange="photoRead(this.files[0]); this.value=''"></label>
          <button class="btn btn-primary" id="runBtn" onclick="run()">Ask the agent</button>
        </div></div>
    </div>
    <div class="underbar" style="margin:14px 0 0"><span class="flabel">Try</span><span id="presets" class="chips"></span><button class="gear" onclick="$('#settings').classList.toggle('open')">Settings and tests</button></div>
  <div class="settings" id="settings">
    <div><h4>Buyer's rules</h4><div id="mandateView"></div>
      <label class="field" for="autoLimit">Agent may order alone up to (€)</label><input type="number" id="autoLimit" step="50" min="0"></div>
    <div><h4>Build the request step by step</h4>
      <input type="text" id="bProduct" placeholder="Product, e.g. muesli" onkeydown="if(event.key==='Enter')bSearch()">
      <div class="chips" id="bAttrs" style="margin-top:8px"></div>
      <div style="display:grid;grid-template-columns:1fr 100px 1fr;gap:8px;margin-top:8px">
        <input type="number" id="bQty" min="1" value="100" aria-label="Quantity"><select id="bUnit" aria-label="Unit"><option value="litres">litres</option><option value="kg">kg</option><option value="pieces">pieces</option></select>
        <input type="date" id="bDate" aria-label="Needed by" style="padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit"></div>
      <div class="chips" id="bAllergies" style="margin-top:8px"></div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-soft" onclick="bSearch()">See what Valio has</button><button class="btn btn-soft" onclick="bWrite()">Write the request</button></div>
      <div id="bResults" class="small" style="margin-top:8px"></div></div>
    <div><h4>Red team</h4>
      <label class="switch" title="A product description tells AI agents to order 10,000 units."><input type="checkbox" id="inject"><span>Prompt injection in supplier data</span></label>
      <label class="switch" title="The offer goes stale between offer and order."><input type="checkbox" id="priceChange"><span>Price changes before ordering</span></label>
      <label class="switch" id="clockSwitch" style="display:none" title="Use Valio's real clock: the data snapshot's cut-offs have passed."><input type="checkbox" id="realClock"><span>Passed order cut-offs</span></label>
      <p class="small muted" style="margin:14px 0 0" id="parserTag"></p></div>
  </div>
  </div>

  <section id="out"></section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => '€' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ALLERGEN = {AN:'tree nuts',AP:'peanuts',SA:'almond',SH:'hazelnut',AS:'sesame',AM:'milk',ML:'lactose',AW:'gluten',AE:'egg',AF:'fish',GO:'oats',UW:'wheat'};
const PRESETS = {
  mnd_hotel_helsinki: [
    ['Milk for Monday', 'I need 1,000 litres of lactose-free milk by Monday. Find an option that meets our requirements based on price and availability.'],
    ['Small top-up', 'We need 100 litres of lactose-free milk by Monday.'],
    ['Organic oat drink', 'Order 200 litres of organic oat drink by Tuesday.'],
    ['Chicken nugget milk?', 'We need 100 litres of chicken nugget milk by Monday.'],
  ],
  mnd_school_espoo: [
    ['Muesli, nut-free', 'We need 40 kg of muesli by Wednesday for the school breakfast.'],
    ['Gluten-free bread', 'Order 60 kg gluten-free bread by Tuesday.'],
    ['Lactose-free milk', 'We need 300 litres of lactose-free milk by Monday.'],
    ['Potatoes', 'Order 200 kg of Finnish potatoes by Wednesday.'],
  ],
  mnd_hospital_ward: [
    ['Lactose-free milk?', 'We need 100 litres of lactose-free milk by Monday.'],
    ['Oat drink', 'Order 100 litres of oat drink by Monday.'],
  ],
};
let mandates = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
const post = (path, body) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

async function init() {
  const [list, info] = await Promise.all([api('/api/mandates'), api('/api/info')]);
  if (info.demo_clock) $('#clockSwitch').style.display = '';
  list.forEach(m => mandates[m.mandate_id] = m);
  $('#mandate').innerHTML = list.map(m => `<option value="${m.mandate_id}">${esc(m.buyer.replace(" (demo)", ""))}</option>`).join('');
  $('#parserTag').textContent = info.ai_parser ? 'Requests are read by Claude; the gateway decides.' : 'Requests are read by rules (no Claude key).';
  renderMandate();
  $('#out').innerHTML = idleHtml();
  fitRequest(); window.addEventListener('resize', fitRequest);
  bInit();
}

function renderMandate() {
  const m = mandates[$('#mandate').value];
  $('#autoLimit').value = m.auto_approve.max_order_total_eur;
  const forb = m.hard_limits.forbidden_allergens.map(a => ALLERGEN[a] || a);
  const prof = m.profile ? Object.entries(m.profile).map(([k, v]) => `${k} ${[v.fat_pct != null ? v.fat_pct + ' %' : '', v.shelf_life === 'any' ? 'fresh or UHT' : (v.shelf_life || '').replace('_', '-')].filter(Boolean).join(', ')}`) : [];
  $('#mandateView').innerHTML = `<div class="mfacts">
      <div><span>Hard limit</span><b>${eur(m.hard_limits.max_order_total_eur).replace('.00', '')}</b></div>
      <div><span>Approvers</span><b>${m.approvers.length}</b></div>
      <div><span>Bans</span><b>${forb.length || '—'}</b></div></div>
    ${forb.length ? `<div class="chips" style="margin-top:10px">${forb.map(a => `<span class="chip bad">no ${a}</span>`).join('')}</div>` : ''}
    <details style="margin-top:10px"><summary>All rules</summary><div class="kv small" style="margin-top:8px">
      <div>Agent</div><div>${esc(m.agent)}</div>
      ${forb.length ? `<div>Unclear data</div><div>“may contain”: ${esc((m.allergen_policy?.may_contain || 'block').replace('_', ' '))} · no data: ${esc((m.allergen_policy?.no_data || 'needs_approval').replace('_', ' '))}</div>` : ''}
      <div>Substitutes</div><div>${esc(m.substitutions.official_substitute.replace('_', ' '))}</div>
      <div>Reliability</div><div>≥ ${(m.min_delivery_reliability * 100).toFixed(0)} %</div>
      ${prof.length ? `<div>Profile</div><div>${prof.map(esc).join('<br>')}</div>` : ''}
      <div>Approvers</div><div>${m.approvers.map(a => `${esc(a.role)} ≤ ${eur(a.up_to_eur).replace('.00', '')}`).join('<br>')}</div></div></details>`;
  $('#presets').innerHTML = EXAMPLES.map(([, , who, what], i) => `<button class="chip" onclick="tryExample(${i})" title="${esc(who)}">${esc(what)}</button>`).join('');
}

// The request box grows with its text instead of scrolling.
function fitRequest() { const t = $('#request'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---- Request builder: a structured way to write the request (same checks as a typed one) ----
const B_ATTRS = [['lactose-free', 'FREE_FROM_LACTOSE'], ['gluten-free', 'FREE_FROM_GLUTEN'], ['organic', 'ORGANIC'], ['vegan', 'VEGAN'], ['Finnish', 'FINNISH']];
const B_ALLERGIES = ['milk', 'gluten', 'eggs', 'peanuts', 'tree nuts', 'sesame', 'fish', 'soy'];
const bSel = {attrs: new Set(), allergies: new Set()};
function bInit() {
  $('#bAttrs').innerHTML = B_ATTRS.map(([l]) => `<button class="chip" onclick="bToggle(this,'attrs','${l}')">${l}</button>`).join('');
  $('#bAllergies').innerHTML = B_ALLERGIES.map(l => `<button class="chip" onclick="bToggle(this,'allergies','${l}')">${l}</button>`).join('');
  const d = new Date(); d.setDate(d.getDate() + 3); $('#bDate').value = d.toISOString().slice(0, 10);
}
function bToggle(el, k, v) { bSel[k].has(v) ? bSel[k].delete(v) : bSel[k].add(v); el.classList.toggle('navy', bSel[k].has(v)); }
async function bSearch() {
  const q = $('#bProduct').value.trim(); if (!q) return;
  const attrs = B_ATTRS.filter(([l]) => bSel.attrs.has(l)).map(([, c]) => c).join(',');
  $('#bResults').innerHTML = '<span class="muted">Looking…</span>';
  try {
    const r = await api(`/api/planner/search?q=${encodeURIComponent(q)}&mandate_id=${$('#mandate').value}&attributes=${attrs}&limit=6`);
    const ok = r.products.filter(p => p.mandate_check.level !== 'block'), no = r.products.length - ok.length;
    $('#bResults').innerHTML = (ok.length ? `<div class="muted">${ok.length} match${ok.length > 1 ? 'es' : ''} the buyer's mandate${no ? `, ${no} ruled out` : ''}:</div>` +
      ok.slice(0, 4).map(p => `<div>· ${esc(p.name)} <span class="faint">per ${esc(p.salesUnit)}${p.mandate_check.level === 'check' ? ' · a person checks: ' + esc(p.mandate_check.why) : ''}</span></div>`).join('')
      : `<div class="bad">Nothing that fits this buyer's mandate${no ? ` (${no} ruled out)` : ''}. Try other words.</div>`);
  } catch (e) { $('#bResults').innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
function bWrite() {
  const product = $('#bProduct').value.trim(), qty = Number($('#bQty').value);
  if (!product || !(qty > 0)) { $('#bResults').innerHTML = '<span class="bad">Give a product and a quantity.</span>'; return; }
  const attrs = [...bSel.attrs].join(' '), al = [...bSel.allergies];
  const allergy = al.length ? `, for guests allergic to ${al.length > 1 ? al.slice(0, -1).join(', ') + ' and ' + al.at(-1) : al[0]}` : '';
  setTimeout(fitRequest);
  $('#request').value = `Order ${qty} ${$('#bUnit').value} of ${attrs ? attrs + ' ' : ''}${product} by ${$('#bDate').value}${allergy}.`;
  $('#request').focus();
}

async function run() {
  const btn = $('#runBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Working…';
  $('#out').innerHTML = idleHtml(true); animateWork();
  $('#out').scrollIntoView({behavior: 'smooth', block: 'start'});
  try {
    const res = await post('/api/run', {
      request: $('#request').value, mandate_id: $('#mandate').value, auto_limit: Number($('#autoLimit').value),
      simulate_price_change: $('#priceChange').checked, inject: $('#inject').checked, real_clock: $('#realClock').checked });
    clearTimeout(workTimer);
    LAST = res;
    await settle(res);
  } catch (e) {
    $('#out').innerHTML = `<div class="decision red"><div class="what"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div></div>`;
  }
  btn.disabled = false; btn.textContent = 'Ask the agent';
}

let LAST = null;

// ---- A photographed list: each line becomes a request and runs through the same six checks ----
let PHOTO = null, PHOTO_RES = [];
async function photoRead(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  $('#out').innerHTML = `<div class="photo"><img src="${url}" alt="The photographed list"><div><h2 class="rhead">Reading the list…</h2>
    <p class="muted">The photo is transcribed into lines. Nothing is ordered yet.</p></div></div>`;
  const fd = new FormData(); fd.append('photo', file);
  try {
    const r = await fetch('/api/photo', {method: 'POST', body: fd});
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.statusText);
    PHOTO = j; PHOTO_RES = [];
    $('#out').innerHTML = `<div class="photo"><img src="${url}" alt="The photographed list"><div>
      <h2 class="rhead">${j.lines.length} line${j.lines.length === 1 ? '' : 's'} read from the photo <span class="tag">${esc(j.reader)}</span></h2>
      <div id="plines">${j.lines.map((l, i) => `<div class="pline" id="pl-${i}" onclick="photoOpen(${i})">
        <input type="checkbox" ${l.blocked || !l.legible ? '' : 'checked'} ${l.blocked ? 'disabled' : ''} onclick="event.stopPropagation()" aria-label="Order this line">
        <div class="pw"><span class="hand">${esc(l.written)}</span><span class="req">${l.blocked ? `<b style="color:var(--bad)">${esc(l.blocked)}</b>` : esc(l.request) + (l.legible ? '' : ' <b style="color:var(--warn)">check the amount</b>')}</span></div>
        <div class="pout"></div></div>`).join('')}</div>
      ${j.note ? `<p class="small muted" style="margin:10px 0 0">${esc(j.note)}</p>` : ''}
      <div class="pfoot"><div class="grow" id="psum"></div><button class="btn btn-primary" style="width:auto;margin:0" id="pRun" onclick="photoRun()">Ask the agent for these lines</button></div>
      </div></div><div id="lineDetail"></div>`;
  } catch (e) {
    $('#out').innerHTML = `<div class="decision red"><div class="what"><h2>Couldn't read the photo</h2><p>${esc(e.message)}</p></div></div>`;
  }
}

function miniTrack(res) {
  const l = res.ladder; if (!l) return '<div class="mini"></div>';
  const tone = {person_approves: 'a', person_checks: 'a'}[l.action] || 'r';
  const all = l.action === 'order' && !l.decided_by;
  return `<div class="mini ${all ? 'g' : ''}">${l.gates.map((g, i) => `<i class="${g.state === 'fail' ? tone : g.state === 'not_reached' ? 'o' : ''}"></i>${i < 5 ? `<s class="${g.state === 'not_reached' || (g.state === 'fail') ? 'o' : ''}"></s>` : ''}`).join('')}</div>`;
}

function lineOutcome(res) {
  const o = res.order;
  if (o?.status === 'placed') return ['g', 'Ordered', o.total];
  if (o?.status === 'pending_approval') return ['a', `Waiting for ${firstName(o.policy.approver?.name)}`, o.total];
  if (o?.status === 'blocked') return ['r', 'Stopped', o.total];
  if (res.ladder?.action === 'ask_back' || res.result.status === 'not_in_catalog' || res.result.status === 'unit_mismatch') return ['q', 'Needs a word from you', null];
  return ['r', 'Not ordered', null];
}

async function photoRun() {
  const btn = $('#pRun'); btn.disabled = true; btn.textContent = 'Working…';
  const todo = PHOTO.lines.map((l, i) => i).filter(i => document.querySelector(`#pl-${i} input`).checked);
  todo.forEach(i => document.querySelector(`#pl-${i} .pout`).innerHTML = '<span class="spin2"></span>');
  const one = async i => {
    try {
      const res = await post('/api/run', {request: PHOTO.lines[i].request, mandate_id: $('#mandate').value, auto_limit: Number($('#autoLimit').value),
                                          real_clock: $('#realClock').checked});
      PHOTO_RES[i] = res;
      const [c, t, eurv] = lineOutcome(res);
      document.querySelector(`#pl-${i} .pout`).innerHTML = `${miniTrack(res)}<span class="st ${c}">${esc(t)}</span><b>${eurv != null ? eur(eurv).replace('.00', '') : ''}</b>`;
    } catch (e) { document.querySelector(`#pl-${i} .pout`).innerHTML = `<span class="st r">${esc(e.message)}</span>`; }
  };
  for (let k = 0; k < todo.length; k += 2) await Promise.all(todo.slice(k, k + 2).map(one));  // two at a time, gentle on Valio's API
  const outs = todo.map(i => PHOTO_RES[i] && lineOutcome(PHOTO_RES[i])).filter(Boolean);
  const sum = c => outs.filter(o => o[0] === c);
  const tot = a => a.reduce((x, o) => x + (o[2] || 0), 0);
  $('#psum').innerHTML = [sum('g').length && `<b style="color:var(--ok)">${sum('g').length} ordered</b> ${eur(tot(sum('g'))).replace('.00', '')}`,
    sum('a').length && `<b style="color:var(--warn)">${sum('a').length} waiting for a person</b>`,
    sum('r').length && `<b style="color:var(--bad)">${sum('r').length} stopped</b>`,
    sum('q').length && `<b style="color:var(--valio)">${sum('q').length} need a word from you</b>`].filter(Boolean).join(' · ') + '<br><span class="small muted">Click a line to see its checks and decide.</span>';
  btn.textContent = 'Done'; 
}

function photoOpen(i) {
  const res = PHOTO_RES[i]; if (!res) return;
  document.querySelectorAll('.pline').forEach(x => x.classList.toggle('on', x.id === 'pl-' + i));
  LAST = res;
  $('#lineDetail').innerHTML = saidHtml(res) + stepsHtml(res) + alertHtml(res) + `<div id="decision">${decisionHtml(res)}</div>` + linksHtml(res);
  $('#lineDetail').scrollIntoView({behavior: 'smooth', block: 'start'});
}

// The progress row that was animating while the agent worked becomes the result in place: no redraw.
async function settle(res) {
  const live = document.querySelector('.steps.live'), fresh = document.createElement('div');
  fresh.innerHTML = stepsHtml(res);
  const next = fresh.querySelector('.steps');
  if (!live || !next) {  // nothing to continue from (e.g. no ladder): show the result directly
    $('#out').innerHTML = saidHtml(res) + stepsHtml(res) + alertHtml(res) + `<div id="decision">${decisionHtml(res)}</div>` + linksHtml(res);
    return;
  }
  const said = document.querySelector('.said.working');
  if (said) { said.nextElementSibling?.classList.contains('saidnote') && said.nextElementSibling.remove(); said.outerHTML = saidHtml(res); }
  live.className = 'steps';
  const olds = live.querySelectorAll('.s'), news = next.querySelectorAll('.s');
  for (let i = 0; i < olds.length; i++) {
    olds[i].className = news[i].className; olds[i].innerHTML = news[i].innerHTML; olds[i].style.animationDelay = '';
    if (i >= 2 && i < olds.length - 1 && !news[i].classList.contains('off')) await sleep(140);
  }
  live.insertAdjacentHTML('afterend', alertHtml(res) + `<div id="decision">${decisionHtml(res)}</div>` + linksHtml(res));
}
const GATE_NAMES = {purchase: 'A purchase', clear: 'Clear', possible: 'Valio has it', allowed: 'Safe', proven: 'Proven', authority: "Agent's call"};
const GATE_HINT = {purchase: 'An order, not a question', clear: 'Amount, product and date known', possible: 'Real products, priced, in time',
                   allowed: 'Hard rules no one can override', proven: 'Facts backed by Valio data', authority: 'Within what the agent may spend'};

const EXAMPLES = [
  ['mnd_hotel_helsinki', 'I need 1,000 litres of lactose-free milk by Monday.', 'Hotel', 'More than the agent may buy alone'],
  ['mnd_hotel_helsinki', 'We need 100 litres of lactose-free milk by Monday.', 'Hotel', 'A small, routine order'],
  ['mnd_hospital_ward', 'We need 100 litres of lactose-free milk by Monday.', 'Hospital ward', 'On a ward where milk is banned'],
  ['mnd_hotel_helsinki', 'We need 100 litres of chicken nugget milk by Monday.', 'Hotel', 'Something that doesn’t exist'],
];
const WORK = ['Reading the request', 'Making sure it’s clear', 'Searching 17,546 products and asking Valio for prices', 'Checking the hard rules', 'Checking the facts', 'Checking the agent’s limits'];

function stepsIdle(cls = '') {
  return `<div class="steps idle ${cls}">${Object.entries(GATE_NAMES).map(([k, n], i) =>
    `<div class="s" data-i="${i}"><div class="dot">${i + 1}</div><h3>${n}${k === 'allowed' ? '<span class="tag">hard rules</span>' : ''}</h3><ul><li class="more">${GATE_HINT[k]}</li></ul></div>`).join('')}</div>`;
}

function idleHtml(working) {
  if (working) return `<p class="said working">“${esc($('#request').value)}”</p><div class="saidnote"></div>` + stepsIdle('live');
  return `<h2 class="rhead">What happens next</h2>${stepsIdle()}
    <p class="idlehint">The first “no” decides who acts next: the agent, a person, or nobody.</p>`;
}

function tryExample(i) {
  const [m, t] = EXAMPLES[i];
  $('#mandate').value = m; renderMandate(); $('#request').value = t; fitRequest(); run();
}

// While the agent works: each check lights up in turn. The real result replaces this when it arrives.
let workTimer = null;
function animateWork() {
  let i = 0;
  const tick = () => {
    document.querySelectorAll('.steps.live .s').forEach((el, j) => {
      el.classList.toggle('passing', j < i); el.classList.toggle('now', j === i);
      el.querySelector('ul').innerHTML = `<li class="more">${j === i ? esc(WORK[j]) + '…' : esc(GATE_HINT[Object.keys(GATE_NAMES)[j]])}</li>`;
    });
    if (i < 2) { i++; workTimer = setTimeout(tick, 700); }   // the search and Valio's prices take most of the time: wait there
  };
  tick();
}

// The request in the buyer's own words, with what the agent understood highlighted.
function saidHtml(res) {
  const i = res.steps[0]?.intent || {};
  let raw = esc(i.raw || $('#request').value);
  const unitWords = '(?:litres?|liters?|l|kg|kilos?|kilograms?|pieces|pcs|eggs?|packs?|cartons?|boxes|bottles)';
  const marks = [];
  if (i.quantity != null) marks.push(new RegExp(`\\d[\\d,. ]*\\s*${unitWords}?\\b`, 'i'));
  (i.attributes || []).forEach(a => { const w = a.startsWith('FREE_FROM_') ? a.slice(10).toLowerCase() + '[- ]?free' : a.toLowerCase(); marks.push(new RegExp(w, 'i')); });
  if (i.product) marks.push(new RegExp(i.product.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'), 'i'));
  marks.push(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|today|next week|\d{4}-\d\d-\d\d|\d{1,2}\.\d{1,2}\.?)\b/i);
  marks.forEach(re => { raw = raw.replace(re, m => `\u0001${m}\u0002`); });
  raw = raw.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  const notes = [
    ...(i.from_profile || []).map(x => `<span>${esc(x)} from the buyer’s profile</span>`),
    ...(i.allergies || []).map(x => `<span class="bad">no ${esc(x)}</span>`),
    ...(i.ignored_terms || []).length ? [`<span class="warn">not understood: ${esc(i.ignored_terms.join(', '))}</span>`] : [],
    ...(i.product_note ? [`<span class="warn">${esc(i.product_note)}</span>`] : []),
  ];
  return `<p class="said">“${raw}”</p><div class="saidnote">${notes.join('')}</div>`;
}

const SHORT_RULE = {'Mandate valid': 'Mandate signed by the buyer', 'Forbidden allergens': 'No banned allergens', 'Required claims': 'Required claims met',
  'Substitutions allowed': 'Substitutes allowed', "Matches the buyer's request": 'Matches what was asked', 'Allergens verifiable from data': 'Allergens in the data',
  'Claims verified in product data': 'Claims in product data', 'Stock confirmed by Valio': 'In Valio’s stock', 'Delivery history known': 'Delivery history known',
  'Pack contents known': 'Pack contents known', 'Delivery on time': 'Arrives on time', 'Auto-approve spend limit': 'Within what it may spend alone',
  "Agent's own spend in 24 h": 'Within its 24 h allowance', 'Full quantity': 'Full quantity', 'Delivery reliability': 'Reliable supplier'};

function stepsHtml(res) {
  const l = res.ladder; if (!l) return '';
  const st = {}; res.steps.forEach(x => st[x.step] = x);
  const lk = st.lookup, pa = st.price_availability, intent = st.request?.intent || res.steps[0]?.intent || {};
  const rules = res.order?.policy?.rules || [];
  const m = mandates[$('#mandate').value] || {};
  const tone = {person_approves: 'person', person_checks: 'person', stop: 'stop', decline: 'stop', ask_back: 'back', answer: 'back'}[l.action] || 'stop';
  const short = t => { t = String(t || '').replace(/^Nothing was ordered: /, '').split(/\. |; /)[0]; return t.length > 110 ? t.slice(0, 107).replace(/\s\S*$/, '') + '…' : t; };
  const li = (cls, t, title) => `<li class="${cls}"${title ? ` title="${esc(title)}"` : ''}>${esc(t)}</li>`;
  function ruleList(g) {
    const rs = rules.filter(r => r.gate === g); if (!rs.length) return '';
    const bad = rs.filter(r => !r.ok), good = rs.filter(r => r.ok);
    const label = r => r.rule === 'Hard spend limit' ? `Under the ${eur(m.hard_limits?.max_order_total_eur ?? 0).replace('.00', '')} limit` : (SHORT_RULE[r.rule] || r.rule);
    const show = good.slice(0, Math.max(0, 3 - bad.length));
    const said = r => {
      const tot = eur(res.order?.total ?? 0).replace('.00', '');
      if (r.rule === 'Auto-approve spend limit') return `${tot} is over the ${eur(m.auto_approve?.max_order_total_eur ?? 0).replace('.00', '')} it may spend alone`;
      if (r.rule === "Agent's own spend in 24 h") return `Over its ${eur(m.auto_approve?.max_auto_eur_per_24h ?? 0).replace('.00', '')} allowance for 24 h`;
      return g === 'authority' || g === 'proven' ? r.detail.replace(/\.0\b/, '') : `${label(r)}: ${r.detail}`;
    };
    return bad.map(r => li(r.level === 'block' ? 'n' : 'x', cap(said(r)), r.detail)).join('')
      + show.map(r => li('', label(r), r.detail)).join('')
      + (good.length > show.length ? `<li class="more" title="${esc(good.slice(show.length).map(r => r.rule).join(', '))}">+ ${good.length - show.length} more passed</li>` : '');
  }
  function facts(key, state) {
    const fail = state === 'fail';
    if (fail && !rules.some(r => r.gate === key && !r.ok)) return li(tone === 'person' ? 'x' : tone === 'back' ? 'q' : 'n', cap(short(l.reason || res.result.error)));
    if (key === 'purchase') return li('', intent.request_type === 'question' ? 'A question' : 'An order, not a question');
    if (key === 'clear') return li('', 'Amount, product, date') + (intent.from_profile || []).slice(0, 2).map(x => li('', `${x[0].toUpperCase() + x.slice(1)} from the profile`)).join('');
    if (key === 'possible' && lk) {
      const ok = pa ? pa.rows.filter(r => r.status === 'ok').length : lk.candidates.length;
      const when = intent.deliver_by ? new Date(intent.deliver_by + 'T12:00').toLocaleDateString('en-GB', {weekday: 'long'}) : 'in time';
      return `<div class="count"><b>17,546</b><i>→</i><b>${ok}</b><br>products that fit and arrive ${esc(when)}</div><ul>${li('', `${res.api_calls.length} live Valio calls`)}</ul>`;
    }
    if (key === 'allowed') return ruleList('allowed') + (st.offer && !fail ? '' : '');
    if (key === 'proven') {
      const ev = (res.order?.record?.offer?.lines?.[0]?.evidence || []).filter(e => !e.startsWith('contains')).slice(0, 2);
      return ruleList('proven') || ev.map(e => li('', e[0].toUpperCase() + e.slice(1))).join('');
    }
    if (key === 'authority') return ruleList('authority');
    return '';
  }
  return `<div class="steps">${l.gates.map((g, i) => {
    const state = g.state, cls = state === 'pass' ? (l.action === 'order' && !l.decided_by ? 'done' : '') : state === 'fail' ? 'fail ' + tone : 'off';
    const icon = state === 'pass' ? '✓' : state === 'fail' ? (tone === 'stop' ? '×' : tone === 'back' ? '?' : '!') : i + 1;
    const body = state === 'not_reached' ? '' : facts(g.key, state);
    return `<div class="s ${cls}" style="animation-delay:${i * 90}ms"><div class="dot">${icon}</div>
      <h3>${GATE_NAMES[g.key]}${g.key === 'allowed' ? '<span class="tag">hard rules</span>' : ''}</h3>${body.startsWith('<div') ? body : `<ul>${body}</ul>`}</div>`;
  }).join('')}</div>`;
}

// Red-team results shown as one line above the decision.
function alertHtml(res) {
  const a = res.steps.find(x => x.step === 'attack_result'), inj = res.steps.find(x => x.step === 'injection_scan'), rej = res.steps.find(x => x.step === 'order_rejected');
  const parts = [];
  if (inj) parts.push(`<b>Hidden instructions</b> in the supplier text of ${esc(inj.product.name)}: treated as data, not followed.`);
  if (a) parts.push(`<b>A hijacked agent</b> tried to order ${a.units.toLocaleString('en-US')} × ${esc(a.product)}${a.total_eur ? ` (${eur(a.total_eur)})` : ''}: ${a.order ? 'blocked by the gateway' : 'refused before an offer'}.`);
  if (rej) parts.push(`<b>Price changed</b> after the offer: the stale order was refused and the agent took a fresh offer.`);
  return parts.length ? `<div class="alertline">${parts.join('<br>')}</div>` : '';
}

const cap = t => { t = String(t || ''); return t ? t[0].toUpperCase() + t.slice(1) : t; };
const shortName = n => String(n || '').replace(/®/g, '').replace(/Hyvä suomalainen Arki /, '').replace(/\s+/g, ' ').trim();
const firstName = n => String(n || '').split(' ')[0];
function lineText(o) { return o.record.offer.lines.map(l => `${l.units.toLocaleString('en-US')} × ${esc(shortName(l.name))}`).join(' + '); }

function decisionHtml(res) {
  const o = res.order, r = res.result, l = res.ladder || {};
  const bar = (tone, title, text, right = '') => `<div class="decision ${tone}"><div class="what"><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}</div>${right}</div>`;
  const fixChip = (label, call) => `<div class="chips"><button class="chip" onclick='${call}'>${esc(label)}</button></div>`;
  if (!o) {
    if (r.status === 'not_in_catalog') {
      const sg = r.suggestions || [];
      return bar('', 'Not in Valio’s catalog', esc(r.error), sg.length ? `<div class="chips">${sg.map(x => `<button class="chip" onclick='useSuggestion(${esc(JSON.stringify(res.steps[0].intent.product))}, ${esc(JSON.stringify(x.phrase))})'>${esc(x.phrase)}</button>`).join('')}</div>` : '');
    }
    if (r.status === 'unit_mismatch') return bar('', 'The unit doesn’t fit the product', esc(r.error), fixChip(r.fix.label, `switchUnit(${JSON.stringify(r.fix.to)})`));
    if (r.status === 'over_hard_limit') return bar('red', 'Over the buyer’s hard limit', esc(r.error), r.fix ? fixChip(r.fix.label, `setQuantity(${JSON.stringify(r.fix.quantity)})`) : '');
    if (r.status === 'answered') return bar('', 'Answered, nothing ordered', esc(l.reason || ''));
    if (l.action === 'ask_back') return bar('', 'Back to you: nothing ordered', esc(r.error));
    if (l.action === 'decline') return bar('red', 'Declined', esc(r.error));
    if (l.action === 'stop' && /oat drink/.test(r.error || '')) return bar('red', 'Not ordered: a hard rule stops it', esc(cap(String(r.error).replace(/^Nothing was ordered: /, ''))),
      `<div class="acts"><button class="btn btn-primary" style="width:auto;margin:0" onclick="tryInstead('oat drink')">Ask for oat drink instead</button></div>`);
    if (r.status === 'no_safe_product') return bar('red', 'No safe product: nothing ordered', esc(r.error));
    if (r.status === 'no_option') return bar('', 'Nothing can be ordered as asked', esc(r.error));
    return bar('red', 'Not ordered', esc(cap(String(r.error || String(r.status).replace('_', ' ')).replace(/^Nothing was ordered: /, ''))));
  }
  const price = `<span class="eur">${eur(o.total).replace('.00', '')}</span>`;
  if (o.status === 'placed') return bar('green', 'Ordered by the agent', `${lineText(o)} <span>within its own authority</span>`, price);
  if (o.status === 'blocked') {
    const why = o.policy.rules.filter(x => !x.ok && x.level === 'block').map(x => (SHORT_RULE[x.rule] || x.rule) + ': ' + x.detail);
    return bar('red', 'Not ordered: a hard rule stops it', esc(why.join('; ')), price);
  }
  if (o.status === 'rejected') return bar('red', 'Rejected', lineText(o), price);
  const ap = o.policy.approver, fact = o.policy.ladder?.decided_by === 'proven';
  return bar('amber', fact ? `Waiting for ${esc(firstName(ap.name))} to check a fact` : `Waiting for ${esc(firstName(ap.name))}’s approval`,
    `${lineText(o)} <span>${esc(ap.role)}, may approve up to ${eur(ap.up_to_eur).replace('.00', '')}</span>`,
    `${price}<div class="acts"><button class="btn btn-bad" onclick="decide('${o.id}','reject','${esc(ap.name)}')">Reject</button>
      <button class="btn btn-soft" onclick="phoneApprove('${o.id}','${esc(ap.name)}')">Approve on phone</button>
      <button class="btn btn-primary" style="width:auto;margin:0" onclick="decide('${o.id}','approve','${esc(ap.name)}')">${fact ? 'Confirm checked' : 'Approve'}</button></div>
      ${fact ? `<input id="fc-${o.id}" class="field" placeholder="What did you check? e.g. Valio confirmed 1,000 in stock by phone">` : ''}<div id="qrbox" style="flex-basis:100%"></div>`);
}

function linksHtml(res) {
  const has = k => res.steps.some(x => x.step === k);
  const L = [has('price_availability') && ['products', 'Products compared'], has('offer') && ['offer', 'Signed offer'], res.order && ['record', 'Audit trail'],
             res.steps.some(x => ['injection_scan', 'attack_result', 'order_rejected'].includes(x.step)) && ['redteam', 'Red team details']].filter(Boolean);
  return L.length ? `<div class="dlinks">${L.map(([k, t]) => `<button data-k="${k}" onclick="openDetail('${k}', this)">${t}</button>`).join('')}</div><div class="dpanel" id="dpanel"></div>` : '';
}

async function openDetail(k, btn) {
  const on = btn.classList.contains('on');
  document.querySelectorAll('.dlinks button').forEach(b => b.classList.remove('on'));
  if (on) { $('#dpanel').innerHTML = ''; return; }
  btn.classList.add('on');
  const st = {}; LAST.steps.forEach(x => st[x.step] = x);
  if (k === 'products') $('#dpanel').innerHTML = stepBody(st.price_availability) + (st.options ? '<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">' + stepBody(st.options) : '');
  if (k === 'offer') $('#dpanel').innerHTML = LAST.steps.filter(x => x.step === 'offer').map(stepBody).join('<hr>');
  if (k === 'redteam') $('#dpanel').innerHTML = LAST.steps.filter(x => ['injection_scan', 'attack_result', 'order_rejected'].includes(x.step)).map(stepBody).join('<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">');
  if (k === 'record') { $('#dpanel').innerHTML = '<p class="muted">Loading…</p>'; await showRecord(LAST.order.id); }
}

function chip(s) {
  const m = {ok: ['ok', 'Available'], partial: ['warn', 'Partial'], deadline_passed: ['bad', 'Deadline passed'], unavailable: ['bad', 'Not in time'],
             blocked: ['bad', 'Sales block'], no_price: ['bad', 'No price'], unit_mismatch: ['warn', 'Unit unclear']};
  const [c, t] = m[s] || ['', s];
  return `<span class="chip ${c}">${t}</span>`;
}

let BODY_ONLY = false;
function stepBody(s) { BODY_ONLY = true; try { return renderStep(s, 0); } finally { BODY_ONLY = false; } }

function step(n, title, body, cls = 'done', tag = '') {
  if (BODY_ONLY) return body;
  return `<div class="step ${cls}"><div class="bullet">${n}</div><div class="card">
    <div class="step-head"><h3>${esc(title)}</h3>${tag ? `<span class="tag">${tag}</span>` : ''}</div>${body}</div></div>`;
}

function renderStep(s, n) {
  if (s.step === 'request') {
    const i = s.intent;
    return step(n, 'Understand the request', `<div class="kv">
      <div>Product</div><div class="name">${esc(i.product)}</div>
      <div>Quantity</div><div>${i.quantity ?? '—'} ${esc(i.unit)}</div>
      <div>Requirements</div><div class="chips">${i.attributes.map(a => `<span class="chip navy">${esc(a.replaceAll('_', ' ').toLowerCase())}</span>`).join('') || '<span class="faint">none</span>'}</div>
      <div>Deliver by</div><div>${esc(i.deliver_by)}</div>
      ${i.request_type && i.request_type !== 'buy' ? `<div>Request type</div><div><span class="chip">${esc(i.request_type)}</span></div>` : ''}
      ${i.ignored_terms?.length ? `<div>Not covered</div><div class="chips">${i.ignored_terms.map(w => `<span class="chip warn">${esc(w)}</span>`).join('')}</div>` : ''}
      ${s.injection?.length ? `<div>Instructions in the request</div><div class="chips">${[...new Set(s.injection)].map(w => `<span class="chip bad">${esc(w)}</span>`).join('')}<span class="faint small">not followed</span></div>` : ''}
      </div>
      ${(i.from_profile || []).length ? `<p class="small" style="margin:10px 0 0"><span class="chip navy">From the buyer profile</span> ${esc(i.from_profile.join(' · '))} <span class="muted">(not stated in the request)</span></p>` : ''}
      ${i.product_note ? `<p class="small" style="margin:10px 0 0"><span class="chip warn">Kept the buyer's words</span> ${esc(i.product_note)}</p>` : ''}`, s.injection?.length || i.ignored_terms?.length ? 'alert' : 'done', `<span class="chip">${esc(i.parser.split(' (')[0] === 'rules' ? 'rule-based' : i.parser)}</span>`);
  }
  if (s.step === 'lookup') {
    const t = s.search;
    return step(n, 'Find candidates in the catalog', `<div class="funnel">
      <div><b>17,546</b>products</div><div><b>${t.text_matches}</b>match “${esc(t.query)}”</div>
      <div><b>${t.after_modifier_filter}</b>plain products</div><div><b>${t.shortlisted}</b>shortlisted</div></div>
      ${s.excluded_by_mandate.length ? (() => {
        const ex = s.excluded_by_mandate, counts = {};
        ex.forEach(e => counts[e.reason] = (counts[e.reason] || 0) + 1);
        const list = ex.map(e => `${esc(e.name)} <span class="muted">(${esc(e.reason)})</span>`).join(' · ');
        return `<p class="small" style="margin:12px 0 0"><span class="chip bad">Excluded by mandate: ${ex.length}</span>
          ${Object.entries(counts).map(([r, n]) => `${n} × ${esc(r)}`).join(' · ')}</p>
          ${ex.length > 3 ? `<details style="margin-top:6px"><summary>Show products</summary><p class="small" style="margin:6px 0 0">${list}</p></details>`
                         : `<p class="small" style="margin:6px 0 0">${list}</p>`}`; })() : ''}
      ${t.reality_check ? `<p class="small" style="margin:12px 0 0"><span class="chip ${t.reality_check.kept_categories.length ? 'ok' : 'bad'}">Reality check</span>
        ${t.reality_check.kept_categories.length ? `kept only products that <i>are</i> ${esc(t.query)}` : `nothing in the catalog is ${esc(t.query)}`}${t.reality_check.removed.length
          ? ` · removed ${t.reality_check.removed.map(r => `${r.count} like “${esc(r.examples[0])}”`).slice(0, 3).join(', ')}` : ''}</p>` : ''}
      ${Object.keys(t.failed_checks || {}).length ? `<p class="small muted" style="margin:12px 0 0">Checked against product data, not names: ${Object.entries(t.failed_checks).map(([k, v]) => `${v} ${esc(k === 'lactose' ? 'contain lactose (> 0 g/100 g)' : k)}`).join(' · ')}</p>` : ''}
      ${s.official_substitutes_added.length ? `<p class="small" style="margin:8px 0 0"><span class="chip warn">Official substitutes added</span> ${s.official_substitutes_added.join(', ')}</p>` : ''}
      ${(s.substitutes_rejected || []).length ? `<p class="small" style="margin:8px 0 0"><span class="chip bad">Substitutes rejected</span> ${s.substitutes_rejected.map(e => `${esc(e.name)} <span class="muted">(${esc(e.reason)})</span>`).join(' · ')}</p>` : ''}`,
      'done', '<span class="chip">local search · no API calls</span>');
  }
  if (s.step === 'injection_scan') {
    return step(n, 'Supplier text contains hidden instructions', `
      <p class="small muted" style="margin:0 0 8px">Product description of <b>${esc(s.product.name)}</b>, as delivered by the supplier feed:</p>
      <div class="quote">${esc(s.text)}</div>
      <div class="chips" style="margin-top:10px">${[...new Set(s.findings.map(f => f.why))].map(w => `<span class="chip bad">${esc(w)}</span>`).join('')}</div>
      <p class="small muted" style="margin:10px 0 0">The gateway treats supplier text as data, never instructions, and flags it for Valio. The honest agent drops this product.</p>`,
      'alert', '<span class="chip bad">Red team</span>');
  }
  if (s.step === 'attack_result') {
    const o = s.order, failed = o ? o.policy.rules.filter(r => !r.ok) : [];
    return step(n, 'A fooled agent tries to obey anyway', `
      <p style="margin:0 0 10px">Simulated compromised agent orders <b>${s.units.toLocaleString('en-US')} × ${esc(s.product)}</b>${s.total_eur ? ` for <b>${eur(s.total_eur)}</b>` : ''}.</p>
      ${o ? `<div class="banner bad"><h3>Blocked by the gateway</h3>
        <ul class="rules">${failed.filter(r => r.level === 'block').map(r => `<li><span class="ic block">✕</span>${esc(r.rule)}<span class="detail">${esc(r.detail)}</span></li>`).join('')}</ul></div>`
        : `<div class="banner bad"><h3>Refused before an offer</h3>${esc(s.error)}</div>`}
      <p class="small muted" style="margin:10px 0 0">Even a fully hijacked agent can't spend outside its mandate. The real request continues below.</p>`,
      'alert', '<span class="chip bad">Red team</span>');
  }
  if (s.step === 'price_availability') {
    const rows = s.rows.map(r => {
      const usable = r.status === 'ok' || r.status === 'partial';
      const tr = r.trust || {};
      return `<tr class="${usable ? '' : 'dim'}"><td><div class="name">${esc(r.name)}</div><div class="faint small">${r.productId}${r.substitution ? ' · official substitute' : ''}${r.evidence ? ' · ' + esc(r.evidence.slice(0, 3).join(' · ')) : ''}</div></td>
      <td>${chip(r.status)}${r.issues.filter(i => !i.startsWith('delivered from')).map(i => `<div class="small muted" style="margin-top:3px">${esc(i)}</div>`).join('')}
        ${usable && tr.stock ? `<div class="small" style="margin-top:3px;color:${tr.stock_known ? 'var(--mute)' : 'var(--warn)'}">${esc(tr.stock.split(':')[0])}</div>` : ''}
        ${usable && (tr.data_gaps || []).length ? `<div class="small" style="margin-top:2px;color:var(--warn)">${esc(tr.data_gaps.join(' · '))}</div>` : ''}</td>
      <td class="r">${r.price_per_req_unit != null ? eur(r.price_per_req_unit) : '—'}</td>
      <td class="r">${r.units != null ? r.units.toLocaleString('en-US') + ' ' + esc(r.sales_unit) : '—'}</td>
      <td class="r">${r.total != null ? eur(r.total) : '—'}</td>
      <td class="r">${r.reliability != null ? Math.round(r.reliability * 100) + ' %' : '<span class="faint">n/a</span>'}</td>
      <td class="r">${r.score != null ? r.score.toFixed(2) : ''}</td></tr>`; }).join('');
    const head = `<thead><tr><th>Product</th><th>Status</th><th class="r">€ per unit asked</th><th class="r">Order</th><th class="r">Total</th><th class="r">Reliability</th><th class="r">Score</th></tr></thead>`;
    const nOk = s.rows.filter(r => r.status === 'ok' || r.status === 'partial').length, nBad = s.rows.length - nOk;
    const why = {}; s.rows.slice(nOk).forEach(r => why[r.status] = (why[r.status] || 0) + 1);
    const allRows = rows.split('</tr>').filter(x => x.trim());
    return step(n, 'Ask Valio for price and availability', `<div style="overflow-x:auto"><table>${head}<tbody>${allRows.slice(0, nOk).join('</tr>')}</tr></tbody></table></div>
      ${nBad ? `<details style="margin-top:10px"><summary>${nBad} more can't be delivered in time: ${Object.entries(why).map(([k, v]) => `${v} ${esc(k.replace('_', ' '))}`).join(', ')}</summary>
        <div style="overflow-x:auto;margin-top:8px"><table>${head}<tbody>${allRows.slice(nOk).join('</tr>')}</tr></tbody></table></div></details>` : ''}`,
      'done', `<span class="chip">live API · ${s.rows.length} products, not 17,546</span>`);
  }
  if (s.step === 'options') {
    if (!s.options.length) return step(n, 'Compare options', '<p>Nothing can be delivered in time.</p>', 'alert');
    const gaps = (s.spec_gaps || []).filter(g => g.cheapest_per_value && Object.keys(g.cheapest_per_value).length > 1);
    const gapHtml = gaps.length ? `<div class="banner warn" style="margin-bottom:12px;padding:12px 16px"><div class="small"><b>Not specified by the buyer, so the agent compared across it:</b>
      ${gaps.map(g => `<div style="margin-top:4px">${esc(g.field)}: ${Object.entries(g.cheapest_per_value).map(([k, v]) => `${esc(k)} ${eur(v)}/unit`).join(' · ')}
      ${g.cost_spread_eur ? ` <b>→ moves this order by ${eur(g.cost_spread_eur).replace('.00', '')}</b>` : ''}</div>`).join('')}
      <div class="muted" style="margin-top:4px">No question first: if this moves the order by more than the mandate's tolerance (€${esc(mandates[$('#mandate').value]?.auto_approve?.max_unstated_detail_spread_eur ?? 25)}), the approver chooses. Otherwise the agent takes the best option.</div></div></div>` : '';
    const note = s.note ? `<p class="small" style="margin:12px 0 0"><span class="chip warn">Within limits</span> ${esc(s.note)}</p>` : '';
    return step(n, 'Compare options', gapHtml + note + `<div class="options">${s.options.map((o, i) => `<div class="option ${i === 0 ? 'chosen' : ''}">
      <div class="lbl">${esc(o.label)}${i === 0 ? ' · chosen' : ''}</div><div class="total">${eur(o.total_eur)}</div>
      ${o.lines.map(l => `<div class="small">${l.units.toLocaleString('en-US')} × ${esc(l.name)}</div>`).join('')}
      <div class="small faint" style="margin-top:6px">${esc(o.why)}${o.partial ? ' · partial' : ''}</div></div>`).join('')}</div>`);
  }
  if (s.step === 'offer') {
    const o = s.offer;
    return step(n, 'Get a signed, fixed-price offer', `<div class="kv">
      <div>Offer</div><div>${o.offer_id}</div><div>Total</div><div class="name">${eur(o.total_eur)} <span class="muted">· catalog price, not negotiated</span></div>
      <div>Valid until</div><div>${new Date(o.expires_at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} <span class="muted">· ${esc(o.expiry_reason || '')}</span></div>
      <div>Trust flags</div><div class="small">${o.lines.map(l => esc((l.trust?.stock || '') + (l.trust?.data_gaps?.length ? ' · ' + l.trust.data_gaps.join(' · ') : ''))).join('<br>')}</div></div>
      <details style="margin-top:12px"><summary>Signature (Ed25519) · anyone can verify it with Valio's public key</summary>
        <div class="mono" style="margin-top:10px">${esc(s.jws)}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <button class="btn btn-soft" onclick='verify(this, ${JSON.stringify(s.jws)})'>Verify signature</button>
          <button class="btn btn-soft" onclick='verify(this, ${JSON.stringify(tamper(s.jws))})'>Halve the price, then verify</button>
          <span class="result"></span></div></details>`);
  }
  if (s.step === 'order_rejected') {
    return step(n, 'Order rejected: the price changed', `<p style="margin:0">${esc(s.error)}</p>
      <p class="small muted" style="margin:6px 0 0">The gateway re-checks live prices before committing, so a stale offer never becomes an order. The agent asks for a fresh offer.</p>`,
      'alert', '<span class="chip bad">Red team</span>');
  }
  if (s.step === 'policy') {
    const p = s.policy;
    const ic = r => r.ok ? '<span class="ic pass">✓</span>' : r.level === 'block' ? '<span class="ic block">✕</span>' : '<span class="ic approve">!</span>';
    return step(n, 'Check the order against the mandate', `<ul class="rules">${p.rules.map(r =>
      `<li>${ic(r)}<span>${esc(r.rule)}</span><span class="detail">${esc(r.detail)}</span></li>`).join('')}</ul>`,
      'done', '<span class="chip">runs in the gateway, not the agent</span>');
  }
  return '';
}

function tamper(jws) {
  const [h, p, sig] = jws.split('.');
  const json = JSON.parse(decodeURIComponent(escape(atob(p.replace(/-/g, '+').replace(/_/g, '/')))));
  json.total_eur = Math.round(json.total_eur * 50) / 100;
  const p2 = btoa(unescape(encodeURIComponent(JSON.stringify(json)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `${h}.${p2}.${sig}`;
}

async function verify(btn, jws) {
  const r = await post('/v1/offers/verify', {jws});
  btn.parentElement.querySelector('.result').innerHTML = r.valid
    ? `<span class="chip ok">Valid · ${eur(r.payload.total_eur)}</span>` : `<span class="chip bad">Rejected · signature doesn't match</span>`;
}

function tryInstead(product) {
  const i = LAST?.steps[0]?.intent || {}, t = $('#request');
  const asked = [...(i.attributes || []).map(a => a.startsWith('FREE_FROM_') ? a.slice(10).toLowerCase() + '[- ]?free ' : ''), i.product || ''].join('');
  t.value = t.value.replace(new RegExp(asked || i.product, 'i'), product);
  run();
}

function setQuantity(q) {
  const t = $('#request');
  t.value = t.value.replace(/\d[\d,. ]*\d|\d/, Number(q).toLocaleString('en-US'));
  t.focus(); window.scrollTo({top: 0, behavior: 'smooth'});
  fitRequest();
}

function switchUnit(to) {
  const t = $('#request'), word = {KG: 'kg', L: 'litres', PCS: 'pieces'}[to];
  t.value = t.value.replace(/\b(litres?|liters?|litroja|litraa|l|kg|kilos?|kilograms?|kiloa|pieces|pcs)\b/i, word);
  t.focus(); window.scrollTo({top: 0, behavior: 'smooth'});
  fitRequest();
}

function useSuggestion(asked, phrase) {
  const t = $('#request'), re = new RegExp(asked.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  t.value = re.test(t.value) ? t.value.replace(re, phrase) : `${t.value} (${phrase})`;
  t.focus(); window.scrollTo({top: 0, behavior: 'smooth'});
  fitRequest();
}

// Hand the approval to a phone: a signed, single-use link as a QR code. The page updates when the phone decides.
let qrPoll = null;
async function phoneApprove(id, who) {
  const r = await api(`/api/approval-link/${id}?approver=${encodeURIComponent(who)}`);
  $('#qrbox').innerHTML = `<div class="qr"><div class="qrimg">${r.svg}</div><div><b>Scan to approve as ${esc(who)}</b>
    <p class="small muted" style="margin:6px 0 0">Works once, for this order only, for 30 minutes. No sign-in needed.</p>
    <p class="small" style="margin:8px 0 0"><a href="${esc(r.url)}" target="_blank">Open the link</a></p></div></div>`;
  clearInterval(qrPoll);
  qrPoll = setInterval(async () => {
    const o = await api(`/v1/orders/${id}`).catch(() => null);
    if (!o || o.status === 'pending_approval') return;
    clearInterval(qrPoll);
    const a = (o.record.approvals || []).slice(-1)[0] || {};
    decided(o, `${o.status === 'placed' ? 'Approved' : 'Rejected'} on a phone by ${a.approver || who}`);
  }, 2000);
}

async function decide(id, decision, who) {
  clearInterval(qrPoll);
  let o;
  const fc = document.getElementById(`fc-${id}`);
  try { o = await post(`/v1/approvals/${id}`, {decision, approver: who, comment: fc && fc.value.trim() ? fc.value.trim() : `${decision}d in demo UI`}); }
  catch (e) {
    const p = document.querySelector('#decision .what p');
    if (p) p.innerHTML = `<b style="color:var(--bad)">${esc(e.message)}</b>`;
    return;
  }
  decided(o, `${decision === 'approve' ? 'Approved' : 'Rejected'} by ${who}`);
}

// After a person decides: the bar becomes the receipt, and the last check turns green or red.
function decided(o, title) {
  const placed = o.status === 'placed';
  $('#decision').innerHTML = `<div class="decision ${placed ? 'green' : 'red'}"><div class="what"><h2>${esc(title)}${placed ? ': ordered' : ''}</h2>
    <p>${lineText(o)} <span>${placed ? 'placed at the signed price' : 'nothing was ordered'}</span></p></div><span class="eur">${eur(o.total).replace('.00', '')}</span></div>`;
  const last = document.querySelector('.steps .s.fail');
  if (last) { last.className = 's ' + (placed ? 'done' : 'fail stop'); last.querySelector('.dot').textContent = placed ? '✓' : '×';
    last.querySelector('ul')?.insertAdjacentHTML('beforeend', `<li class="${placed ? '' : 'n'}">${esc(title)}</li>`); }
  if (placed) document.querySelectorAll('.steps .s:not(.fail):not(.off)').forEach(s => { s.classList.add('done'); });
}

async function showRecord(id) {
  const d = await api(`/v1/orders/${id}/decision`);
  const o = d.order, off = o.record.offer, failed = o.policy.rules.filter(r => !r.ok);
  const story = `Asked <i>“${esc(o.record.context.request || '')}”</i>, the agent compared ${o.record.rows?.length ?? '?'} products with
    ${o.record.api_calls?.length ?? '?'} live API calls and chose <b>${off.lines.map(l => `${l.units.toLocaleString('en-US')} × ${esc(l.name)}`).join(' + ')}</b>
    for <b>${eur(off.total_eur)}</b> (${esc((o.record.context.rationale || '').replace(/\.$/, ''))}).
    ${failed.length ? `It needed sign-off because of: ${failed.map(r => esc(r.rule.toLowerCase())).join(', ')}.` : 'It was within the agent\'s own authority.'}
    ${(o.record.approvals || []).map(a => `${esc(a.approver)} ${a.decision === 'approve' ? 'approved' : 'rejected'} it.`).join(' ')}`;
  $('#dpanel').innerHTML = `<div>
    <p style="margin:0 0 14px">${story}</p>
    <table><thead><tr><th>Time (UTC)</th><th>Who</th><th>What</th><th class="r">Hash</th></tr></thead><tbody>
    ${d.events.sort((a, b) => a.seq - b.seq).map(e => `<tr><td>${e.ts.slice(11, 19)}</td><td>${esc(e.actor)}</td><td>${esc(e.type)}</td><td class="r faint mono" style="background:none;border:0;padding:10px">${e.hash.slice(0, 10)}…</td></tr>`).join('')}</tbody></table>
    <p class="small muted" style="margin:12px 0 0">${d.chain.valid ? `<span class="chip ok">Audit chain intact · ${d.chain.events} events</span>` : '<span class="chip bad">Audit chain broken</span>'}
    &nbsp;Each event's hash covers the one before, so edits to history show. Buyer and Valio see the same record.</p>
    <div class="chips" style="margin-top:12px">${o.status === 'placed' ? `<a class="chip navy" href="/v1/orders/${o.id}/peppol.xml" target="_blank">Peppol order · UBL XML</a>` : ''}
      <a class="chip navy" href="/v1/mandates/${o.mandate_id}/credential" target="_blank">Buyer-signed mandate · W3C VC</a>
      <a class="chip navy" href="/.well-known/jwks.json" target="_blank">Offer signing key</a></div></div>`;
}

init();
</script>
