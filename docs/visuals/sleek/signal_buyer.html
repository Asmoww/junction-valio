<!doctype html><html lang="en"><meta charset="utf-8"><title>Signal · buyer</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root { --blue:#0047bb; --ink:#061a44; --mute:#7a88a6; --amber:#c46a00; --red:#cf2f2a; --line:#e3e9f4; --soft:#e8effb }
* { box-sizing:border-box } body { margin:0; font:16px/1.5 Archivo, system-ui, sans-serif; color:var(--ink); background:#fff }
.bar { display:flex; align-items:center; gap:28px; padding:24px 64px; border-bottom:1px solid var(--line) }
.logo { font-weight:900; font-stretch:125%; letter-spacing:-.02em; font-size:19px; color:var(--blue) }
.bar nav { display:flex; gap:24px; font-size:15px; color:var(--mute) } .bar nav b { color:var(--ink); font-weight:600 }
.who { margin-left:auto; background:var(--soft); color:var(--blue); font-weight:600; border-radius:99px; padding:7px 16px; font-size:14px }
main { padding:56px 64px 0; max-width:1440px }
.said { font-size:40px; font-weight:500; letter-spacing:-.02em; line-height:1.25; margin:0; max-width:1100px }
.said mark { background:none; color:var(--blue); font-weight:800; box-shadow:inset 0 -.14em 0 var(--soft) }
.ladder { display:grid; grid-template-columns:repeat(6,1fr); margin:72px 0 0; position:relative }
.ladder::before { content:""; position:absolute; left:28px; right:calc(100%/6 - 28px); top:27px; height:4px; background:var(--blue) }
.st { position:relative; text-align:left; font-size:15px; color:var(--mute) }
.st i { display:grid; place-items:center; width:58px; height:58px; border-radius:50%; background:var(--blue); color:#fff; font-style:normal; font-weight:800; font-size:20px; margin-bottom:14px; position:relative }
.st.stop i { background:#fff; color:var(--amber); border:4px solid var(--amber); width:74px; height:74px; margin-top:-8px; font-size:26px }
.st.stop { color:var(--ink); font-weight:700 }
.out { display:grid; grid-template-columns:1fr auto; align-items:end; gap:40px; margin-top:64px; padding-top:40px; border-top:1px solid var(--line) }
h1 { font-size:56px; font-weight:850; font-stretch:115%; letter-spacing:-.035em; margin:0; line-height:1 }
.pick { font-size:19px; margin:14px 0 0 } .pick span { color:var(--mute) }
.act { display:flex; gap:12px; align-items:center }
.btn { font:inherit; font-weight:700; font-size:17px; border-radius:99px; padding:16px 28px; border:0 }
.ok { background:var(--blue); color:#fff } .ghost { background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line) }
.eur { font-weight:850; font-stretch:115%; font-size:40px; letter-spacing:-.03em; margin-right:18px }
.next { margin-top:56px; display:flex; gap:14px; background:#f4f7fc; border-radius:99px; padding:8px 8px 8px 28px; align-items:center }
.next input { flex:1; font:inherit; font-size:18px; border:0; outline:0; background:transparent; color:var(--ink) } .next input::placeholder { color:#9aa7c2 }
</style>
<header class="bar"><span class="logo">Valio Aimo agents</span><nav><b>Buy</b><span>Plan</span><span>Valio</span><span>Connect</span></nav><span class="who">Hotel Aurora</span></header>
<main>
  <p class="said">“I need <mark>1,000 litres</mark> of <mark>lactose-free</mark> <mark>milk</mark> by <mark>Monday</mark>.”</p>
  <div class="ladder">
    <div class="st"><i>✓</i>A purchase</div><div class="st"><i>✓</i>Clear</div><div class="st"><i>✓</i>Valio has it</div>
    <div class="st"><i>✓</i>Allowed</div><div class="st"><i>✓</i>Proven</div><div class="st stop"><i>€</i>Above the agent’s €500</div>
  </div>
  <div class="out">
    <div><h1>Waiting for Aino</h1><p class="pick">1,000 × Valio Eila lactose-free milk 1 L <span>cheapest of 14 that arrive Monday</span></p></div>
    <div class="act"><span class="eur">€1,010</span><button class="btn ghost">Reject</button><button class="btn ghost">Phone</button><button class="btn ok">Approve</button></div>
  </div>
<div class="next"><input placeholder="What else does the kitchen need?"><button class="btn ok">Ask the agent</button></div>
</main>
</html>
